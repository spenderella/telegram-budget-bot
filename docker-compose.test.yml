version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: telegram-bot-test-db
    environment:
      POSTGRES_USER: ${TEST_DB_USER}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD}
      POSTGRES_DB: ${TEST_DB_NAME}
    ports:
      - ${TEST_DB_PORT}:${DB_PORT}  # Different port to not conflict with dev DB